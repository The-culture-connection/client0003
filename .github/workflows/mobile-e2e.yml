# Playwright suite for the mobile app's web build on Railway
# (mobile-test-suite/). Runs after Railway reports a successful Stage deploy,
# or by hand from the Actions tab.
#
# Secrets: QA_EMAIL, QA_PASSWORD (the dedicated QA account), optional
# SUITE_PASSWORD (if the service sets one). Variable: SUITE_URL.
name: Mobile E2E

on:
  deployment_status:
  workflow_dispatch:

concurrency:
  # One run at a time: every test signs in as the same QA account.
  group: mobile-e2e
  cancel-in-progress: false

jobs:
  e2e:
    # Railway names GitHub deployments "<project> / <environment>" with no
    # service name, so this runs after any successful Stage deploy (web app or
    # this suite) — both can change what the tests see.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Mortar Digital Curriculum / Stage')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile-test-suite/e2e
    env:
      CI: "true"
      SUITE_URL: ${{ vars.SUITE_URL }}
      QA_EMAIL: ${{ secrets.QA_EMAIL }}
      QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
      SUITE_PASSWORD: ${{ secrets.SUITE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            mobile-test-suite/e2e/playwright-report
            mobile-test-suite/e2e/test-results
          retention-days: 14
