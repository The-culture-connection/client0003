
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>MORTAR</title>
      <script>
        // Apply the saved theme before first paint so light-mode users
        // don't see a dark flash. Kept in sync by ThemeContext.tsx.
        try {
          if (localStorage.getItem("mortar-theme") === "light") {
            document.documentElement.classList.add("light");
          }
        } catch (e) {}
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
