# Railway deployment config for Digital Curriculum (Vite + React SPA)
# When linking this project, set Root Directory to "Digital Curriculum" in the service settings.
# Build uses src/mortar-analytics-contract (not ../functions) so Docker/Nixpacks contexts without the monorepo succeed.
# Watch Paths: from repo root, so this service only deploys when files under Digital Curriculum change.

[build]
builder = "nixpacks"
# 1) Builders often install with NODE_ENV=production first, so Vite (a devDependency) is missing.
# 2) Do NOT run a second `npm ci` here: it tries to rmdir the whole tree and can hit EBUSY on
#    `node_modules/.cache` when an install layer already ran. `npm install --include=dev` only
#    adds devDependencies on top of the existing tree, then we build.
buildCommand = "npm install --include=dev --no-audit --no-fund && npm run build"
watchPatterns = ["Digital Curriculum", "Digital Curriculum/**"]

[deploy]
# This overrides package.json "start" — change it here, not there, or the
# change silently does nothing.
#
# Was `npx serve -s dist -l $PORT`. `serve -s` rewrites every extension-less
# request path to the SPA shell whether or not a real file sits there, and
# Apple requires /.well-known/apple-app-site-association to have no extension,
# so iOS was handed index.html instead of JSON and Universal Links failed
# silently. (Android was unaffected: assetlinks.json has an extension.) No
# serve.json setting can exempt that path — see docs/mobile-app-links.md for
# the four that were tried.
#
# The two things `serve` was relied on for still hold:
#   * /privacy.html is served as a real file, not 301'd to /privacy and then
#     answered with the empty React shell. That redirect is what Google Play's
#     policy checker would have seen, since it does not run JavaScript, and it
#     is why public/serve.json set cleanUrls=false. express.static serves the
#     file directly, so the hazard is gone rather than configured around.
#   * Unknown paths still fall back to index.html, so client-side routes work
#     on a hard refresh.
#
# public/serve.json is now inert — nothing reads it. It is kept so that
# reverting this line to the old `serve` command still behaves correctly.
startCommand = "node ./scripts/serve-dist.mjs"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
