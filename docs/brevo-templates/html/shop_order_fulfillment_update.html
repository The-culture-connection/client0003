<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Your Mortar shop order update</title>
</head>
<body style="margin:0;padding:0;background-color:#ececec;font-family:Arial,Helvetica,sans-serif;">
  <span style="display:none!important;visibility:hidden;font-size:1px;">Update on your Mortar shop order.</span>
  <table role="presentation" width="100%" style="background-color:#ececec;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="600" style="max-width:600px;width:100%;">
        <tr><td style="background-color:#871002;padding:24px 32px;border-radius:8px 8px 0 0;">
          <p style="margin:0;font-size:22px;font-weight:bold;color:#fafcfc;">Order update</p>
        </td></tr>
        <tr><td style="background-color:#fff;padding:32px;border:1px solid #e0e0e0;border-top:none;">
          <p style="margin:0 0 16px;font-size:16px;color:#2d2d2d;">Hi {{ params.first_name }},</p>
          <p style="margin:0 0 16px;font-size:16px;line-height:1.6;color:#2d2d2d;">
            Your shop order <strong>{{ params.order_id }}</strong> status: <strong>{{ params.fulfillment_status }}</strong>.
          </p>
          <p style="margin:0 0 8px;font-size:14px;font-weight:bold;color:#2d2d2d;">Items</p>
          <p style="margin:0 0 20px;font-size:15px;line-height:1.7;color:#2d2d2d;white-space:pre-wrap;">{{ params.order_lines_plain }}</p>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#2d2d2d;">{{ params.tracking_line }}</p>
          <p style="margin:0;font-size:14px;color:#666;">Questions? <a href="mailto:{{ params.support_email }}" style="color:#871002;">{{ params.support_email }}</a></p>
        </td></tr>
        <tr><td style="background:#f5f5f5;padding:16px;text-align:center;border-radius:0 0 8px 8px;border:1px solid #e0e0e0;border-top:none;">
          <p style="margin:0;font-size:12px;color:#888;"><a href="{{ params.platform_url }}" style="color:#871002;">Mortar</a></p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
